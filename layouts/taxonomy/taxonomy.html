{{ define "main" }}
<h1>{{ .Title }}</h1>

<ul class="taxonomy-list">
    {{ range $name, $taxonomy := .Site.Taxonomies.publisher }}
    <li>
        <a href="/publishers/{{ $name | urlize }}">
            {{ $name }} <span class="count">({{ $taxonomy.Count }})</span>
        </a>
    </li>
    {{ end }}
</ul>
{{ end }}
