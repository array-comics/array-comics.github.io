{{ define "main" }}
<article class="comic-single">
    <div class="comic-header">
        <div class="cover-large">
            {{ with .Params.cover }}
            <img src="{{ .image }}" alt="{{ $.Title }}">
            {{ end }}
        </div>
        <div class="comic-info">
            <h1>{{ .Title }}</h1>
            <p class="meta">
                <strong>Издатель:</strong> <a href="/publishers/{{ .Params.publisher | urlize }}">{{ .Params.publisher }}</a><br>
                <strong>Серия:</strong> <a href="/series/{{ .Params.series | urlize }}">{{ .Params.series }}</a><br>
                <strong>Год:</strong> {{ .Params.year }}<br>
                <strong>№ выпуска:</strong> {{ .Params.issue_number }}
            </p>
            <div class="tags">
                {{ range .Params.tags }}
                <a href="/tags/{{ . | urlize }}" class="tag">{{ . }}</a>
                {{ end }}
            </div>
        </div>
    </div>
    
    <div class="comic-content">
        {{ .Content }}
    </div>
</article>
{{ end }}
