{{ define "main" }}
<h1>Последние выпускиу</h1>

<div class="comics-grid">
{{ range sort .Paginator.Pages ".Params.added_date" "desc" }}
    <article class="comic-card">
        <a href="{{ .Permalink }}">
            {{ with .Params.cover }}
            <div class="cover">
                <img src="{{ .image }}" alt="{{ $.Title }}" loading="lazy">
            </div>
            {{ end }}
            <h2>{{ .Title }}</h2>
            <p class="publisher">{{ .Params.publisher }}</p>
        </a>
    </article>
    {{ end }}
</div>

{{ partial "pagination.html" . }}
{{ end }}
